name: Publish GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Validate tag and prepare release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/prepare_release.py
      - name: Publish wheel, sdist, documentation, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/* --verify-tag
          --title "saolei-api $RELEASE_TAG" --notes-file docs/release-notes.md
